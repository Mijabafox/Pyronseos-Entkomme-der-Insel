Diese Datei wird aus src/config.ts erzeugt. Sie ist die Grundlage des Regel-Assistenten.

## Ziel des Spiels
Die Spieler sind auf einer Vulkaninsel gestrandet. Sie sammeln Rohstoffe, bauen Werkzeuge und müssen von der Insel entkommen, bevor der Vulkan an Tag ${t} ausbricht. ${$.ANZAHL_MIN} bis ${$.ANZAHL_MAX} Spieler, jeder Sitzplatz Mensch oder KI, mehrere Menschen an einem Gerät (Hot-Seat).

## Spielmodi
${xu()}
- Koop: Alle spielen gemeinsam gegen die Insel. Es gibt keine Angriffe zwischen Spielern und kein Duell (die Duell-Karte ist im Koop ein Platzhalter ohne Wirkung).
- Team: 2 feste Zweierteams (Sitze abwechselnd: Team Sonne = Sitz 1 und 3, Team Mond = Sitz 2 und 4). Teampartner reanimieren sich gegenseitig, greifen sich nicht an und fliehen zusammen.
- PvP: Jeder spielt für sich. Wer 0 Herzen hat, scheidet aus.

## Spielfeld
- 169 Sechseckfelder (8 pro Kante), Ringe 0 bis 7.
- Ring 0 + 1 = 7 Vulkanfelder, Ring 7 = 42 Strandfelder (im Uhrzeigersinn 1–42, Feld 42 grenzt an Feld 1).
- Die Biom-Zonen sind fest und immer sichtbar (Farbe). Die Inhalte sind je Biom gemischt und verdeckt.
- Verdeckte Plättchen zeigen nur das Biom, der Inhalt wird erst beim Aufdecken sichtbar.
- Erledigtes verschwindet: abgebaute Bäume, Felsen, Blätterbüsche, Abfall, besiegte Tiere und gezogene Spezialkarten werden entfernt, es bleibt leerer Boden. Wasserquellen, Flugzeugwrack und Vulkan werden nie entfernt.

## Plättchen je Biom
${["wald","wiese","gebirge","strand","vulkan"].map(dc).join(`
`)}
- Strand = 42 Felder im Ring 7 + 5 innere Dünen. Insgesamt 20 Spezialfelder.
- Vulkan: 1 Vulkanfels mit Kompass (zufällig auf einem der 7 Vulkanfelder), 6 leer. Auf Vulkanfeldern gibt es keine Tiere, Spezialfelder oder Rohstoffe.

## Spieler und Charaktere
- ${$.HERZEN} Herzen, ${$.ENERGIE} Energie (auch Maximum).
- 0 Herzen: Koop und Team – die Figur liegt am Boden. Ein Mitspieler (Team: nur der Teampartner) auf demselben Feld oder einem Nachbarfeld kann sie mit einer Pflanzenbandage reanimieren (steht mit ${$.REANIMATION_HERZEN} Herzen auf). PvP – die Figur scheidet aus, der Kompass geht unter den Vulkanfels zurück.
- Mehrere Figuren dürfen auf demselben Feld stehen.
- Die Charaktere werden bei jeder neuen Partie zufällig zugelost (keine Wahl, jeder höchstens einmal).
- Offene Information: Koop – Rohstoffe, Ausrüstung und Charakter aller Figuren sind für alle sichtbar (Gruppenleiste mit einer Karte pro Figur), nur die Spezialkarten bleiben verdeckt (Anzahl sichtbar). Team – dasselbe nur für den Teampartner; vom Gegnerteam sieht man Herzen, Energie und Anzahl Handkarten. PvP – alles verdeckt, nur der Kompass liegt offen.
- Kein Slot-Limit für Rohstoffe und Spezialkarten.
- Ausrüstung: höchstens 1 Steinaxt, 1 Spitzhacke, 1 Waffe.
${xt(Object.keys(I).map(n=>`${I[n].name}: ${I[n].bonus}`))}

## Zeit und Tageskarten
- ${ne.RUHIGE_TAGE} × «Ruhiger Tag» + ${ne.EREIGNISSE_PRO_PARTIE} zufällige aus ${e.length} Ereignissen, gemischt; die ${t}. Karte ist die Lava-Endkarte.
- Pro Tag wird 1 Karte aufgedeckt und gross in der Mitte gezeigt (Einstellung «Tageskarte gross zeigen»). 1 Tag = eine volle Runde aller Spieler.
- Lava-Karte: alle, die noch auf der Insel sind, verlieren.
- Jede neue Partie mischt Charaktere, Tageskarten, Spezialstapel, Routenstapel und Tierbeutel mit einem neuen Seed (ausser ein Seed wird bewusst eingegeben).

## Zug eines Spielers
