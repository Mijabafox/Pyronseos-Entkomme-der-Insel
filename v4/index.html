        <li><b>💧 Trinken</b> – stehst du auf einem Wasserfeld, erscheint der Knopf «Trinken»: Energie sofort voll, so oft du willst (nicht bei Trockenperiode).</li>

      <h3>🐾 Tierkampf</h3>

      <p class="anl-tiere">${Ft("hase",52)} ${Ft("krebs",52)} ${Ft("baer",52)} ${Ft("krokodil",52)}</p>

        <li><b>Grosse Tiere</b> (Bär, Tiger, Schlange, Krokodil): mindestens ${y.ZIEL_GROSS}. Sieg = ${y.NAHRUNG_GROSS} Nahrung, Niederlage = −${y.NIEDERLAGE_GROSS_HERZEN} Herz.</li>

## Ziel des Spiels
Die Spieler sind auf einer Vulkaninsel gestrandet. Sie sammeln Rohstoffe, bauen Werkzeuge und müssen von der Insel entkommen, bevor der Vulkan ausbricht. Nur wer entkommt, gewinnt. Modi: Jeder gegen jeden, Team, Koop. 2 bis 6 Spieler.

## Spielfeld
- 169 Sechseckfelder (8 pro Kante), Ringe 0 bis 7.
- Ring 0 + 1 = 7 Vulkanfelder, Ring 7 = 42 Strandfelder (im Uhrzeigersinn 1–42). Die 6 Kanten von Ring 7 sind die 6 Inselseiten.
- Die Biom-Zonen sind fest und immer sichtbar (Farbe). Die Inhalte sind je Biom gemischt und verdeckt.
- Verdeckte Plättchen zeigen nur die Biomfarbe, der Inhalt wird erst beim Aufdecken sichtbar.
- Abgebaute Plättchen werden entfernt: es bleibt leerer Boden. Tierfelder bleiben, bis das Tier besiegt ist. Wasserfelder und Flugzeugwrack bleiben dauerhaft.

## Plättchen je Biom
${["wald","wiese","gebirge","strand","vulkan"].map(Co).join(`
`)}
- Strand = 42 Felder im Ring 7 + 5 innere Dünen. Insgesamt 20 Spezialfelder.
- Vulkan: 1 Vulkanfels mit Kompass (zufällig auf einem der 7 Vulkanfelder), 6 leer. Auf Vulkanfeldern gibt es keine Tiere, Spezialfelder oder Rohstoffe.

## Spieler und Charaktere
- ${N.HERZEN} Herzen, ${N.ENERGIE} Energie (auch Maximum).
- 0 Herzen: im Modus «Jeder gegen jeden» ausgeschieden, im Team/Koop am Boden und reanimierbar.
- Kein Slot-Limit: Rohstoffe und Spezialkarten liegen verdeckt auf der Hand.
- Ausrüstung offen: höchstens 1 Steinaxt, 1 Spitzhacke, 1 Waffe.
${ut(Object.keys(x).map(n=>`${x[n].name}: ${x[n].bonus}`))}

## Zeit und Tageskarten

- Pro Tag wird 1 Karte aufgedeckt. 1 Tag = eine volle Runde aller Spieler.
- Lava-Karte: alle, die noch auf der Insel sind, verlieren.

## Zug eines Spielers
1. Weitsicht: W3 würfeln, so viele verdeckte Kacheln im Umkreis von ${P.WEITSICHT_RADIUS} Ringen aufdecken.
2. Bewegung: ${P.SCHRITT_ENERGIE} Energie pro Schritt, betretene Felder werden aufgedeckt.
3. Abbau (kostet keine Energie, beendet die Bewegung): Baum ${z(te.FELDER.baum.ertrag)} (mit Steinaxt 1 Holz mehr), Fels ${z(te.FELDER.fels.ertrag)} (mit Spitzhacke 1 Stein mehr), Blätterbusch ${z(te.FELDER.blaetterbusch.ertrag)}, Strandgut ${z(te.FELDER.strandgut.ertrag)}.
4. Spezialfeld, Bauen, Interaktion: Spezialfeld = Spezialkarte ziehen. Craften jederzeit im Zug. Handel im Umkreis ${me.RADIUS}. Angriff im Umkreis ${ne.RADIUS}.
- Danach «Zug beenden».

## Energie und Wasser
- Rasten (keine Bewegung im Zug): +${P.RASTEN} Energie, im Shelter +${P.RASTEN_SHELTER}.
- Nahrung essen: +${P.NAHRUNG_ENERGIE} Energie, jederzeit im eigenen Zug.
- Wasserfelder (Wasserquelle, Bergquelle, Süsswasser-Zufluss): wer darauf steht, kann «Trinken» → Energie auf das Maximum. Beliebig oft nutzbar. Während der «Trockenperiode» sind Wasserfelder wirkungslos.

- Gross, Ziel ${y.ZIEL_GROSS}+: Sieg = ${y.NAHRUNG_GROSS} Nahrung, Niederlage = −${y.NIEDERLAGE_GROSS_HERZEN} Herz, der Zug endet, das Tier bleibt.

- Der Kompass liegt unter dem Vulkanfels (1 der 7 Vulkanfelder, zufällig). Bergung nur mit Spitzhacke, beendet den Zug.
- Routenstapel: ${ct.RICHTUNGEN.length*ct.JE_RICHTUNG} Karten (${ct.RICHTUNGEN.length} Richtungen je ${ct.JE_RICHTUNG}×). Wer den Kompass birgt, zieht geheim 1 Routenkarte = Strandabschnitt für das Floss.

## Tages-Ereignisse
${ut(e.map(n=>`${n.name}: ${n.text}${n.vorlaeufig?" (vorläufig)":""}`))}
- Erdbeben und Vulkanausstoss: W6, bei 1–${Re.WUERFEL_SCHADEN_BIS} −1 Herz.

## Siegbedingungen
1. Floss (Kompass + Routenkarte, am gezogenen Strandabschnitt bauen): Solides Floss ${z(H.SOLIDE)} = Sieg. Not-Floss ${z(H.NOT)}, dann W6: 1–${H.NOT_AUS_BIS} ausgeschieden, ${H.NOT_AUS_BIS+1}–${H.NOT_LAND_BIS} zurück an Land, ${H.NOT_LAND_BIS+1}–6 Sieg. Bei «Aufgewühltes Meer» keine Floss-Flucht.
2. Küsten-Signalfeuer: 3 brennende Lagerfeuer im Strandring auf 3 nicht benachbarten Inselseiten = Sieg.
3. Flugzeugwrack: 1 Brennsprit + ${z(Me.KOSTEN)} auf dem Wrackfeld = Sieg.
4. Letzter Überlebender (Jeder gegen jeden) = Sieg. Lava-Karte = alle verlieren.
- Team/Koop: entkommt einer, gewinnt das ganze Team bzw. alle.

## Spieler angreifen und handeln
- Angriff im Umkreis ${ne.RADIUS}: beide W6 + Waffe. Der Verlierer verliert ${ne.HERZEN} Herz und gibt 1 Ausrüstung oder ${ne.ROHSTOFFE} Rohstoffe ab. Nicht im Koop.
- Handel mit Spielern im Umkreis ${me.RADIUS}.
