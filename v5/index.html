        <div class="anl-kasten"><b>🃏 Freier Tisch</b>
          <p>Wie ein echter Spieltisch: Nichts wird geprüft. Ihr bewegt Figuren, zieht Karten und zählt Werte selbst – wie mit Karton und Würfeln. Nur Menschen, ein Gerät (Hot-Seat).</p>
          <p><b>Nimm diesen Modus, wenn</b> ihr als Team neue Regeln testen wollt (Playtest).</p></div>
      </div>
      <p class="tipp-zeile">💡 Tipp für den Anfang: <b>Regel-Modus</b> · Knopf «Ich mit KI-Mitspielern» · KI-Schwierigkeit <b>Stark</b> (die KI hilft dann am besten mit).</p>`},{symbol:"🧭",titel:"Der Spieltisch",html:()=>`
      <p>Der Bildschirm ist ein Tisch, auf dem alles liegt:</p>
      <div class="anl-tisch" aria-hidden="true">
        <div class="t-oben">☀️ Tageskarten<br><span>Stapel + heutige Karte</span></div>
        <div class="t-links">🂠 Kartenstapel<br><span>Spezial, Kompass/Routen, Baupläne, Rohstoffe, Tierbeutel</span><br>🎲 Würfelschale</div>
        <div class="t-mitte">⬡ Spielbrett<br><span>169 Felder, Figuren</span></div>
        <div class="t-rechts">🧍 Spieler-Panels<br><span>Herzen, Energie, Ausrüstung, Karten</span></div>
        <div class="t-unten">🔍 Zoom + Übersicht<br><span>unten links</span></div>
      </div>
      <h3>Oben: Toolbar und Hinweisleiste</h3>
      <ul>
        <li><b>Toolbar</b> (ganz oben): Reiter 🎲 Spiel / 📖 Regeln / 📊 Simulation, «Tag X / 20», das Wetter, der <b>🌱 Seed</b>, Werkzeuge, Knöpfe wie 📜 Rezepte, 🚩 Fluchtwege und 💬 Regel-Fragen, rechts ❓ Anleitung und «Neue Partie».</li>
        <li><b>Hinweisleiste</b> (darunter): sagt dir <b>immer, was jetzt zu tun ist</b>. Geht ein Klick gerade nicht, erscheint hier ein roter 💡-Hinweis mit dem Grund.</li>
      </ul>
      <h3>Das Spielbrett</h3>
      <ul>
        <li>Aussen der <b>Strand</b> (42 Felder, nummeriert 1–42), innen Wald, Wiese und Gebirge, in der Mitte der <b>Vulkan</b>.</li>
        <li>Die <b>Farbe</b> zeigt immer das Biom: dunkelgrün = Wald, hellgrün = Wiese, grau = Gebirge, sand = Strand, rotbraun = Vulkan.</li>
        <li><b>Verdeckt</b> = dunklere Farbe mit feinen schrägen Linien, der Inhalt ist geheim. <b>Aufgedeckt</b> = hellere, glatte Farbe mit Symbol,
          z. B. 🌳 Baum, ${j("stein",16)} Fels, ${j("blaetter",16)} Blätterbusch, ${j("abfall",16)} Strandgut, ${j("wasser",16)} Wasser, ❗ Spezialfeld. Leeres Feld = aufgedeckt ohne Symbol.</li>
        <li>Tiere liegen als runde Plättchen auf dem Feld (erst sichtbar, wenn das Feld aufgedeckt ist).</li>
        <li>Jede Figur ist ein farbiger Kreis mit den Anfangsbuchstaben des Spielers.</li>
      </ul>`},{symbol:"🖱️",titel:"Bedienung mit der Maus",html:()=>`

        <tr><td>Zoomen</td><td>Mausrad, oder unten links <span class="taste">−</span> <span class="taste">+</span>; Klick auf die %-Zahl zentriert, <span class="taste">⛶</span> = Vollbild</td></tr>
        <tr><td>Irgendwohin springen</td><td>In die Übersichtskarte unten links klicken</td></tr>
        <tr><td>Karte gross ansehen</td><td>Offene Karte anklicken</td></tr>
        <tr><td>Panel verschieben</td><td>An der farbigen Kopfzeile ziehen; ▾ klappt es ein</td></tr>
        <tr><td>Figur finden</td><td>Doppelklick auf die Figur, oder im Panel «Figur zeigen»</td></tr>

        <tr><td>Feld bearbeiten (freier Tisch)</td><td><b>Rechtsklick</b> auf ein Feld: Aufdecken, Verdecken, Inhalt entfernen, Inhalt ändern</td></tr>

      <ul>
        <li><span class="taste">↖</span> <b>Auswählen</b> – das normale Werkzeug zum Spielen. <b>Im Zweifel immer dieses wählen.</b></li>
        <li><span class="taste">✋</span> Tisch verschieben · <span class="taste">📍</span> Notiz-Pin auf den Tisch setzen</li>

      </ul>`},{symbol:"🧍",titel:"Deine Spielfigur",html:()=>`
      <div class="anl-raster">
        <div class="anl-kasten"><b>❤️ Herzen: ${z.HERZEN}</b><p>Dein Leben. Bei 0 liegst du am Boden, bis dich ein Mitspieler mit einer Bandage reanimiert (gleiches Feld oder Nachbarfeld). Liegen alle gleichzeitig am Boden, ist die Partie verloren.</p></div>
        <div class="anl-kasten"><b>⚡ Energie: ${z.ENERGIE}</b><p>Jeder Schritt kostet Energie (Abbauen ist gratis). Neue Energie: Rasten (+${U.RASTEN}), Nahrung essen (+${U.NAHRUNG_ENERGIE}), <b>Trinken</b> auf einem Wasserfeld (voll).</p></div>
        <div class="anl-kasten"><b>🎒 Ausrüstung</b><p>Höchstens 1 Steinaxt, 1 Spitzhacke und 1 Waffe. Sie liegt offen im Panel.</p></div>

      <h3>Charaktere</h3>
      <p>Jeder Spieler bekommt <b>verdeckt</b> eine Rolle mit einem kleinen Vorteil zugelost. Nur du siehst deine eigene, am Spielende werden alle aufgedeckt:</p>
      <ul class="spalten">${Object.keys(M).map(e=>`<li>${M[e].symbol} <b>${M[e].name}:</b> ${M[e].bonus}</li>`).join("")}</ul>`},{symbol:"🔄",titel:"Dein Zug (Regel-Modus)",html:()=>`
      <p>Wenn du dran bist, steht dein Name in der Hinweisleiste und dein Panel ist hervorgehoben. Ein Zug hat immer diese Reihenfolge:</p>
      <ol class="anl-schritte">
        <li><b>🎲 Weitsicht würfeln</b> – Knopf «Würfeln» (oder Taste <span class="taste">W</span>). Der W3 zeigt 1, 2 oder 3.</li>
        <li><b>🔍 Kacheln aufdecken</b> – Jetzt <b>leuchten</b> verdeckte Felder im Umkreis von ${U.WEITSICHT_RADIUS} Ringen um deine Figur. Klicke so viele an, wie der Würfel zeigt.</li>
        <li><b>👣 Bewegen</b> – Jetzt leuchten die <b>Nachbarfelder</b>. Klicke eines an oder ziehe deine Figur darauf. Jeder Schritt kostet ${U.SCHRITT_ENERGIE} Energie.
          Betrittst du ein verdecktes Feld, wird es aufgedeckt. Du kannst mehrmals ziehen, solange du Energie hast.</li>
        <li><b>🪓 Abbauen</b> (wenn du auf Baum, Fels, Blätterbusch oder Strandgut stehst) – Knopf «Abbauen». Kostet <b>keine Energie</b>, aber <b>beendet die Bewegung</b>. Craften, Essen und Trinken gehen danach noch.</li>
        <li><b>💧 Trinken</b> – stehst du auf einem Wasserfeld, erscheint der Knopf «Trinken»: Energie sofort voll, so oft du willst (nicht bei Trockenperiode).</li>
        <li><b>🛠️ Craften, essen, handeln</b> – geht jederzeit in deinem Zug über dein Panel.</li>
        <li><b>✅ Zug beenden</b> – Knopf «Zug beenden» (oder <span class="taste">Enter</span>). Bist du nicht gezogen, hast du gerastet: +${U.RASTEN} Energie.</li>
      </ol>
      <p class="tipp-zeile">💡 Danach ziehen die anderen Spieler bzw. die KI. Gestrichelte Pfeile in der Spielerfarbe zeigen, wohin die KI gegangen ist.
        Verklickt? <span class="taste">↶ Rückgängig</span> oder <span class="taste">Strg</span>+<span class="taste">Z</span> (geht nicht nach Würfeln oder Aufdecken).</p>`},{symbol:"🌳",titel:"Felder und Rohstoffe",html:()=>`
      <h3>Was man abbauen kann</h3>
      <table class="anl-tabelle">
        <tr><th>Feld</th><th>Ertrag</th><th>Mit Werkzeug</th></tr>
        <tr><td>🌳 Baum</td><td>${w(te.FELDER.baum.ertrag)}</td><td>mit 🪓 Steinaxt 1 Holz mehr</td></tr>
        <tr><td>${j("stein",16)} Fels</td><td>${w(te.FELDER.fels.ertrag)}</td><td>mit ⛏️ Spitzhacke 1 Stein mehr</td></tr>
        <tr><td>${j("blaetter",16)} Blätterbusch</td><td>${w(te.FELDER.blaetterbusch.ertrag)}</td><td>–</td></tr>

      </table>
      <p>Abgebaute Felder sind danach leer (Grundboden). Rohstoffe liegen verdeckt bei dir (im Panel sichtbar nur für dich):

      <h3>Besondere Felder</h3>
      <ul>
        <li>${j("wasser",16)} <b>Wasserfeld</b> (Quelle, Bergquelle, Süsswasser): Knopf «💧 Trinken» → Energie voll, so oft du willst (nicht bei Trockenperiode).</li>
        <li>❗ <b>Spezialfeld:</b> Du ziehst eine Spezialkarte. Joker kommen auf die Hand, Gefahren wirken sofort.</li>

        <li>🗿 <b>Vulkanfels mit Kompass:</b> nur mit Spitzhacke zu bergen – wichtig fürs Floss.</li>

      <p>Mit Rohstoffen stellst du Werkzeuge und Bauten her. Im Regel-Modus stehen die Rezepte in deinem Panel unter «🛠️ Craften» –

      <table class="anl-tabelle">
        <tr><th>Gegenstand</th><th>Kosten</th><th>Wirkung</th></tr>

      </table>
      <p class="tipp-zeile">💡 Gute Reihenfolge: Blätter sammeln → Seil → Spitzhacke (für den Kompass) oder Steinaxt (mehr Holz).</p>`},{symbol:"🐾",titel:"Tiere, Karten, Tage",html:()=>`
      <h3>🐾 Tierkampf</h3>
      <p>Wird ein Tierfeld aufgedeckt, kommt ein Tier aus dem Beutel und liegt als rundes Plättchen auf dem Feld. Die Zahl unten ist der Zielwert.
        Betrittst du das Feld: <b>⚔️ Kämpfen</b> (Taste <span class="taste">K</span>) oder auf ein weiss umrandetes Feld <b>fliehen</b> (${R.FLUCHT_ENERGIE} Energie).
        <b>Achtung:</b> Fliehen geht nur bei Tieren, die du vorher offen gesehen hast. Betrittst du ein <b>verdecktes</b> Tierfeld blind, musst du kämpfen.</p>
      <p class="anl-tiere">${It("hase",52)} ${It("krebs",52)} ${It("baer",52)} ${It("krokodil",52)}</p>
      <ul>
        <li><b>Kleine Tiere</b> (Hase, Huhn, Schwein, Krebs): W6 + Bonus muss mindestens ${R.ZIEL_KLEIN} sein. Sieg = ${R.NAHRUNG_KLEIN} Nahrung, Niederlage ohne Schaden.</li>
        <li><b>Grosse Tiere</b> (Bär, Tiger, Schlange, Krokodil): mindestens ${R.ZIEL_GROSS}. Sieg = ${R.NAHRUNG_GROSS} Nahrung, Niederlage = −${R.NIEDERLAGE_GROSS_HERZEN} Herz.</li>
        <li>Bonus: Waffe (Speer +1, Machete +2), Jäger +1.</li>
      </ul>
      <h3>❗ Spezialkarten</h3>
      <p>Joker (z. B. Fernglas, Adrenalin) und Glücksfunde (Heilkräuter, Aussichtsfelsen, Wrack-Fass) kommen auf deine Hand, du spielst sie im Panel aus.
        Gefahren (z. B. Schlange, Fallgrube) wirken sofort. Die <b>Rauchbombe</b> schützt dich automatisch, wenn du gegen ein grosses Tier verlierst.
        Die Karte «Platzhalter (TODO-Regel)» hat noch keine Wirkung.</p>
      <h3>☀️ Tageskarten</h3>
      <p>Zu Beginn jedes Tages wird oben eine Tageskarte aufgedeckt: meist «Ruhiger Tag», manchmal ein Ereignis (Wolkenbruch, Erdbeben …). Die letzte Karte ist die Lava.</p>
      <h3>🤝 Zusammenarbeiten</h3>
      <p>Es gibt keine Angriffe zwischen Spielern. Ihr dürft euch im Umkreis ${ne.RADIUS} Rohstoffe schenken oder tauschen (${ne.PRO_ZUG}× pro Zug).
        Mehrere Figuren dürfen auf demselben Feld stehen.</p>`},{symbol:"🚩",titel:"So gewinnst du",html:()=>`
      <p><b>Koop-Modus:</b> Ihr spielt alle zusammen gegen die Insel. Gewonnen ist nur, wenn <b>alle Figuren gemeinsam fliehen</b> –
        und niemand dabei am Boden liegt (vorher reanimieren). Liegen alle gleichzeitig am Boden, hat die Insel gewonnen.</p>
      <div class="anl-raster">

            3. Wählt darin ein <b>📍 Sammelfeld</b> und trefft euch dort. 4. Stehen alle auf demselben Feld, baut ihr das Floss aus der <b>gemeinsamen Kasse</b>
            (alle Rohstoffe der Figuren auf dem Feld): <b>${w(F.SOLIDE_PRO_PERSON)} pro Person</b> = alle entkommen.</p>
          <p class="klein">Not-Floss (${w(F.NOT_PRO_PERSON)} pro Person): die Gruppe würfelt einmal W6 – 1–${F.NOT_ZERBRICHT_BIS} zerbricht (alle −${F.NOT_SCHADEN} Herzen),
            ${F.NOT_ZERBRICHT_BIS+1}–${F.NOT_LAND_BIS} zurück an Land (das Floss bleibt, nächster Versuch gratis), ${F.NOT_LAND_BIS+1}–6 alle entkommen.</p></div>
        <div class="anl-kasten"><b>🔥 Küsten-Signalfeuer</b>
          <p>3 brennende Lagerfeuer am Strand, auf 3 Inselseiten, die nicht nebeneinander liegen. Gerettet seid ihr, sobald <b>jede Figur auf einem der Feuerfelder</b> steht (verteilt erlaubt).</p></div>
        <div class="anl-kasten"><b>✈️ Flugzeugwrack</b>
          <p>Brennsprit + ${w(Ge.KOSTEN)} (gleich viel, egal wie viele Spieler) – <b>alle Figuren beim Wrack</b>.</p></div>
      </div>
      <p class="tipp-zeile">💡 Im Panel zeigt der Kasten «🤝 Gemeinsam fliehen» die Route, das Sammelfeld und die gemeinsame Kasse auf deinem Feld.</p>`},{symbol:"🃏",titel:"Freier Tisch Schritt für Schritt",html:()=>`
      <p>Im freien Tisch spielt ihr wie am echten Tisch – <b>ihr haltet euch selbst an die Regeln</b>. So geht ein Zug:</p>
      <ol class="anl-schritte">
        <li><b>Wer ist dran?</b> Steht in der Hinweisleiste. Weiter zum Nächsten mit «Nächster Spieler ▶».</li>
        <li><b>Weitsicht:</b> Oben <span class="taste">🎲 Würfeln</span> → «W3» anklicken. Der Würfel rollt in der Würfelschale. Dann so viele <b>verdeckte Felder anklicken</b> – sie werden aufgedeckt (ein Tierfeld zieht dabei das Tier aus dem Beutel).</li>
        <li><b>Bewegen:</b> Deine Figur mit der Maus auf ein Feld <b>ziehen</b> (oder Figur anklicken, dann Feld anklicken). Energie im Panel mit <span class="taste">−</span> abziehen.</li>
        <li><b>Abbauen:</b> Rohstoffe im Panel mit <span class="taste">+</span> dazuzählen. Oder: Rohstoffkarte vom Stapel ziehen und <b>auf dein Panel ziehen</b> – zählt automatisch +1.

        <li><b>Trinken:</b> Steht deine Figur auf Wasser, erscheint im Panel «💧 Trinken» – Energie voll.</li>
        <li><b>Karten:</b> Einen Stapel <b>anklicken</b> = oberste Karte liegt offen auf dem Tisch. Auf ein Panel ziehen = auf die Hand, zurück auf den Stapel = Ablage.</li>
        <li><b>Neuer Tag:</b> Wenn alle dran waren: «☀️ Tageskarte ziehen».</li>
      </ol>
      <h3>Das Spieler-Panel im freien Tisch</h3>
      <ul>
        <li>Name und Rolle ändern · ❤️ Herzen und ⚡ Energie mit <span class="taste">−</span> <span class="taste">+</span></li>
        <li>🪓 ⛏️ ⚔️ Ausrüstung: anklicken = haben / nicht haben</li>
        <li><b>Rohstoffe</b>: 6 Zähler (${j("holz",16)} Holz, ${j("stein",16)} Stein, ${j("blaetter",16)} Blätter, ${j("seil",16)} Seil, ${j("abfall",16)} Abfall, ${j("nahrung",16)} Nahrung) mit <span class="taste">−</span> <span class="taste">+</span></li>
        <li>Handkarten: 👁 ansehen, «Ausspielen» legt sie offen auf den Tisch</li>
      </ul>
      <h3>Nützlich für Playtests</h3>
      <ul>
        <li><span class="taste">📋 Protokoll</span> schreibt jede Aktion mit (als CSV speicherbar) · <span class="taste">💾 Szenarien</span> speichert einen Spielstand</li>
        <li><span class="taste">🐾 Tierjagd</span> zieht ein Tier und würfelt · <span class="taste">＋🃏</span> eigene Karte erfinden · «Edit» zeigt die Inhalte verdeckter Felder blass an</li>
        <li><b>Rechtsklick auf ein Feld</b>: Aufdecken, Verdecken, Inhalt entfernen oder Inhalt ändern (auch ein bestimmtes Tier setzen)</li>
      </ul>`},{symbol:"💡",titel:"Tipps und Hilfe",html:()=>`
      <ul class="anl-liste">
        <li><b>Nichts passiert beim Klicken?</b> Lies die Hinweisleiste oben – dort steht mit 💡, warum. Und prüfe, dass oben das Werkzeug <span class="taste">↖</span> gewählt ist.</li>
        <li><b>Brett verschwunden?</b> Knopf <span class="taste">⌖</span> oben rechts zentriert die Ansicht.</li>
        <li><b>Energie sparen:</b> Trinken auf einem Wasserfeld füllt die Energie ganz auf – plane deinen Weg über Wasser.</li>
        <li><b>Partie nachspielen:</b> Oben steht der <b>🌱 Seed</b>. Gleicher Seed = gleiche Insel und gleiche Stapel. Klick darauf: neuer oder fester Seed.</li>
        <li><b>Regel unklar?</b> Knopf <span class="taste">💬 Regel-Fragen</span> – dort kannst du Fragen zum Regelwerk stellen.</li>
        <li><b>Zuerst Werkzeug:</b> Mit Spitzhacke kommst du an den Kompass, mit Steinaxt an mehr Holz.</li>
        <li><b>Zeit im Blick:</b> Oben steht «Tag x/${Zr}» (bzw. /30). Beginne rechtzeitig mit einem Fluchtweg.</li>
        <li><b>Spielstand:</b> wird automatisch im Browser gespeichert. Neue Partie: Knopf «Neue Partie» oben rechts.</li>
      </ul>
      <h3>Tastatur (Regel-Modus)</h3>
      <p><span class="taste">W</span> würfeln · <span class="taste">K</span> kämpfen · <span class="taste">Enter</span> Zug beenden · <span class="taste">Strg</span>+<span class="taste">Z</span> rückgängig</p>
      <p>Alle Regeln im Detail (Kartenlisten, Ereignisse, Varianten): Reiter <span class="taste">📖 Regeln</span> in der Toolbar.</p>`}];function no(){try{return localStorage.getItem(Fi)==="ja"}catch{return!1}}function ro(){try{localStorage.setItem(Fi,"ja")}catch{}}function Mi(e,t=0){const n=document.querySelector("#dialog");let r=t;const a=()=>{ro(),n.close(),e()},i=()=>{var u;const s=Vt[r],l=r===Vt.length-1,o=Vt.map((c,g)=>`<button type="button" class="anl-kapitel${g===r?" an":""}" data-kapitel="${g}"><span>${c.symbol}</span> ${g+1}. ${c.titel}</button>`).join("");n.innerHTML=`<div class="anleitung">

## Ziel des Spiels
Die Spieler sind auf einer Vulkaninsel gestrandet und spielen gemeinsam gegen die Insel (Koop-Modus). Sie sammeln Rohstoffe, bauen Werkzeuge und müssen zusammen von der Insel entkommen, bevor der Vulkan ausbricht. Gewonnen ist nur, wenn ALLE Figuren gemeinsam fliehen. Liegen alle gleichzeitig am Boden oder kommt die Lava, verlieren alle. 2 bis 6 Spieler, jeder Sitzplatz Mensch oder KI, mehrere Menschen an einem Gerät (Hot-Seat). Es gibt keine Angriffe zwischen Spielern und kein Duell.

## Spielfeld
- 169 Sechseckfelder (8 pro Kante), Ringe 0 bis 7.
- Ring 0 + 1 = 7 Vulkanfelder, Ring 7 = 42 Strandfelder (im Uhrzeigersinn 1–42). Die 6 Kanten von Ring 7 sind die 6 Inselseiten.
- Die Biom-Zonen sind fest und immer sichtbar (Farbe). Die Inhalte sind je Biom gemischt und verdeckt.
- Verdeckte Plättchen zeigen nur die Biomfarbe, der Inhalt wird erst beim Aufdecken sichtbar.
- Abgebaute Plättchen werden entfernt: es bleibt leerer Boden. Tierfelder bleiben, bis das Tier besiegt ist. Wasserfelder und Flugzeugwrack bleiben dauerhaft.

${["wald","wiese","gebirge","strand","vulkan"].map(Qo).join(`
`)}
- Strand = 42 Felder im Ring 7 + 5 innere Dünen. Insgesamt 20 Spezialfelder.
- Vulkan: 1 Vulkanfels mit Kompass (zufällig auf einem der 7 Vulkanfelder), 6 leer. Auf Vulkanfeldern gibt es keine Tiere, Spezialfelder oder Rohstoffe.

## Spieler und Charaktere
- ${z.HERZEN} Herzen, ${z.ENERGIE} Energie (auch Maximum).
- 0 Herzen: die Figur liegt am Boden. Ein Mitspieler auf demselben Feld oder einem Nachbarfeld kann sie mit einer Pflanzenbandage reanimieren (steht mit ${z.REANIMATION_HERZEN} Herzen auf).
- Mehrere Figuren dürfen auf demselben Feld stehen.
- Die Charaktere werden verdeckt zugelost (keine Wahl); jeder sieht nur seinen eigenen, am Spielende werden alle aufgedeckt.
- Kein Slot-Limit: Rohstoffe und Spezialkarten liegen verdeckt auf der Hand.
- Ausrüstung offen: höchstens 1 Steinaxt, 1 Spitzhacke, 1 Waffe.
${st(Object.keys(M).map(n=>`${M[n].name}: ${M[n].bonus}`))}

- Pro Tag wird 1 Karte aufgedeckt. 1 Tag = eine volle Runde aller Spieler.
- Lava-Karte: alle, die noch auf der Insel sind, verlieren.

## Zug eines Spielers
1. Weitsicht: W3 würfeln, so viele verdeckte Kacheln im Umkreis von ${U.WEITSICHT_RADIUS} Ringen aufdecken.
2. Bewegung: ${U.SCHRITT_ENERGIE} Energie pro Schritt, betretene Felder werden aufgedeckt.
3. Abbau (kostet keine Energie, beendet die Bewegung): Baum ${w(te.FELDER.baum.ertrag)} (mit Steinaxt 1 Holz mehr), Fels ${w(te.FELDER.fels.ertrag)} (mit Spitzhacke 1 Stein mehr), Blätterbusch ${w(te.FELDER.blaetterbusch.ertrag)}, Strandgut ${w(te.FELDER.strandgut.ertrag)}.
4. Spezialfeld, Bauen, Interaktion: Spezialfeld = Spezialkarte ziehen. Craften, Essen und Trinken jederzeit im Zug (auch nach dem Abbau). Handeln und Schenken im Umkreis ${ne.RADIUS}.
- Danach «Zug beenden».

## Energie und Wasser
- Rasten (keine Bewegung im Zug): +${U.RASTEN} Energie, im Shelter +${U.RASTEN_SHELTER}.
- Nahrung essen: +${U.NAHRUNG_ENERGIE} Energie, jederzeit im eigenen Zug.
- Wasserfelder (Wasserquelle, Bergquelle, Süsswasser-Zufluss): wer darauf steht, kann «Trinken» → Energie auf das Maximum. Beliebig oft nutzbar. Während der «Trockenperiode» sind Wasserfelder wirkungslos.

- Das Tier wird aus dem Beutel gezogen, wenn das Tierfeld aufgedeckt wird. Wer das Feld betritt, muss kämpfen oder fliehen.
- Flucht: ${R.FLUCHT_ENERGIE} Energie, kein Kampf – nur bei Tieren, die man vorher offen gesehen hat.
- Pflichtkampf: Wer ein verdecktes Tierfeld blind betritt (oder in einen Hinterhalt gerät), muss kämpfen und darf nicht fliehen.
- Klein, Ziel ${R.ZIEL_KLEIN}+ (W6 + Bonus): Sieg = ${R.NAHRUNG_KLEIN} Nahrung, Niederlage = kein Schaden.
- Gross, Ziel ${R.ZIEL_GROSS}+: Sieg = ${R.NAHRUNG_GROSS} Nahrung, Niederlage = −${R.NIEDERLAGE_GROSS_HERZEN} Herz, der Zug endet, das Tier bleibt.
- Bonus: ${Object.values(Ht).map(n=>`${n.name} +${n.kampf}`).join(", ")}, Jäger +1.

## Crafting
${st(Object.values(V).map(n=>`${n.name}: ${w(n.kosten)} – ${n.wirkung}`))}
- Lagerfeuer: beim Bau +${dt.LAGERFEUER_HERZEN} Herzen. Pflanzenbandage: +${dt.BANDAGE_HERZEN} Herzen oder Reanimation. Sanitäter: Bandage kostet nur 1 Blatt, ohne Nahrung.

## Spezialkarten
- Pool ${Qt} Karten. Stapel pro Partie: Brennsprit + ${P.STAPEL-1} zufällige aus den übrigen ${Qt-1} = ${P.STAPEL} Karten.
- Handkarten: Joker und Glücksfunde (auf die Hand, später ausspielen):
${ea("hand")}
- Sofort-Gefahren (wirken sofort) und Platzhalter (ohne Wirkung):
${ea("sofort")}

## Kompass und Routen
- Der Kompass liegt unter dem Vulkanfels (1 der 7 Vulkanfelder, zufällig). Bergung nur mit Spitzhacke, ${te.KOMPASS_ENERGIE} Energie, beendet die Bewegung.
- Routenstapel: ${ot.RICHTUNGEN.length*ot.JE_RICHTUNG} Karten (${ot.RICHTUNGEN.length} Richtungen je ${ot.JE_RICHTUNG}×). Wer den Kompass birgt, zieht OFFEN 1 Routenkarte: alle sehen den Strandabschnitt für das Floss.
- Sammelfeld: Die Routenkarte nennt einen Strandabschnitt (mehrere Felder). Die Gruppe wählt darin ein Feld als Sammelfeld (Treffpunkt). Gebaut wird auf dem Feld im Abschnitt, auf dem alle zusammen stehen.

## Tages-Ereignisse
${st(e.map(n=>`${n.name}: ${n.text}${n.vorlaeufig?" (vorläufig)":""}`))}
- Erdbeben und Vulkanausstoss: W6, bei 1–${ye.WUERFEL_SCHADEN_BIS} −1 Herz.

## Siegbedingungen
- Koop: Gewonnen ist nur, wenn alle Figuren gemeinsam fliehen.
- Gemeinsame Flucht ist erst möglich, wenn niemand mehr am Boden liegt (vorher reanimieren).
- Gemeinsame Kasse: Floss und Wrack bezahlen alle Figuren auf dem Feld zusammen aus ihren Händen.
1. Floss: Kompass + offene Routenkarte. Alle Figuren stehen auf demselben Strandfeld des Abschnitts. Kosten = Kosten für 1 Person × Spielerzahl.
   - Solides Floss: ${ta(F.SOLIDE_PRO_PERSON)} = alle entkommen.
   - Not-Floss: ${ta(F.NOT_PRO_PERSON)}, dann würfelt die Gruppe einmal W6: 1–${F.NOT_ZERBRICHT_BIS} das Floss zerbricht, alle verlieren ${F.NOT_SCHADEN} Herzen (wer auf 0 fällt, liegt am Boden) · ${F.NOT_ZERBRICHT_BIS+1}–${F.NOT_LAND_BIS} zurück an Land, das Floss bleibt liegen, der nächste Versuch kostet kein Material · ${F.NOT_LAND_BIS+1}–6 alle entkommen.
   - Bei «Aufgewühltes Meer» keine Floss-Flucht.
2. Küsten-Signalfeuer: 3 brennende Lagerfeuer im Strandring auf 3 nicht benachbarten Inselseiten. Gerettet sind alle, sobald jede Figur auf einem der Feuerfelder steht (verteilt auf die 3 Feuer erlaubt).
3. Flugzeugwrack: 1 Brennsprit + ${w(Ge.KOSTEN)} (nicht mit der Spielerzahl multipliziert), alle Figuren beim Wrack.
- Lava-Karte oder alle gleichzeitig am Boden = alle verlieren.

## Handeln und Schenken
- Rohstoffe tauschen oder verschenken mit Mitspielern im Umkreis ${ne.RADIUS} (${ne.PRO_ZUG}× pro Zug, höchstens ${ne.MAX_KARTEN} Karten pro Seite).
- Es gibt keine Angriffe zwischen Spielern und kein Duell. Die frühere Duell-Karte ist ein Platzhalter ohne Wirkung.
