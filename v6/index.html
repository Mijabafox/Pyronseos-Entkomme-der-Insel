      <p class="gross">Ihr seid auf einer Vulkaninsel gestrandet. Sammelt Rohstoffe, baut Werkzeuge und findet einen Weg von der Insel –

        <div class="anl-kasten"><b>🗺️ Die Insel ist verdeckt</b><p>Am Anfang sieht man nur den Strand. Was im Wald, auf der Wiese oder im Gebirge liegt, deckt ihr nach und nach auf.</p></div>

      <p>Der Bildschirm ist ein Tisch, auf dem alles liegt:</p>
      <div class="anl-tisch" aria-hidden="true">
        <div class="t-oben">☀️ Tageskarten<br><span>Stapel + heutige Karte</span></div>

        <div class="t-unten">🔍 Zoom + Übersicht<br><span>unten links</span></div>

      <h3>Oben: Toolbar und Hinweisleiste</h3>
      <ul>
        <li><b>Toolbar</b> (ganz oben): Reiter 🎲 Spiel / 📖 Regeln / 📊 Simulation, «Tag X / 20», das Wetter, der <b>🌱 Seed</b>, Werkzeuge, Knöpfe wie 📜 Rezepte, 🚩 Fluchtwege und 💬 Regel-Fragen, rechts ❓ Anleitung und «Neue Partie».</li>
        <li><b>Hinweisleiste</b> (darunter): sagt dir <b>immer, was jetzt zu tun ist</b>. Geht ein Klick gerade nicht, erscheint hier ein roter 💡-Hinweis mit dem Grund.</li>
      </ul>
      <h3>Das Spielbrett</h3>
      <ul>
        <li>Aussen der <b>Strand</b> (42 Felder, nummeriert 1–42), innen Wald, Wiese und Gebirge, in der Mitte der <b>Vulkan</b>.</li>

          z. B. 🌳 Baum, ${G("stein",16)} Fels, ${G("blaetter",16)} Blätterbusch, ${G("abfall",16)} Strandgut, ${G("wasser",16)} Wasser, ❗ Spezialfeld. Leeres Feld = aufgedeckt ohne Symbol.</li>
        <li>Tiere liegen als runde Plättchen auf dem Feld (erst sichtbar, wenn das Feld aufgedeckt ist).</li>
        <li>Jede Figur ist ein farbiger Kreis mit den Anfangsbuchstaben des Spielers.</li>

        <li>Mit <span class="taste">▸</span> klappst du die Leiste ein, damit sie das Brett nicht verdeckt.</li>
      </ul>`},{symbol:"🖱️",titel:"Bedienung mit der Maus",html:()=>`

        <tr><td>Zoomen</td><td>Mausrad, oder unten links <span class="taste">−</span> <span class="taste">+</span>; Klick auf die %-Zahl zentriert, <span class="taste">⛶</span> = Vollbild</td></tr>
        <tr><td>Irgendwohin springen</td><td>In die Übersichtskarte unten links klicken</td></tr>

        <tr><td>Panel verschieben</td><td>An der farbigen Kopfzeile ziehen; ▾ klappt es ein</td></tr>

      <ul>
        <li><span class="taste">↖</span> <b>Auswählen</b> – das normale Werkzeug zum Spielen. <b>Im Zweifel immer dieses wählen.</b></li>

      </ul>`},{symbol:"🧍",titel:"Deine Spielfigur",html:()=>`
      <div class="anl-raster">

        <div class="anl-kasten"><b>⚡ Energie: ${y.ENERGIE}</b><p>Jeder Schritt kostet Energie (Abbauen ist gratis). Neue Energie: Rasten (+${U.RASTEN}), Nahrung essen (+${U.NAHRUNG_ENERGIE}), <b>Trinken</b> auf einem Wasserfeld (voll).</p></div>
        <div class="anl-kasten"><b>🎒 Ausrüstung</b><p>Höchstens 1 Steinaxt, 1 Spitzhacke und 1 Waffe. Sie liegt offen im Panel.</p></div>
      </div>
      <h3>Charaktere</h3>
      <p>Jeder Spieler bekommt eine Rolle mit einem kleinen Vorteil zugelost (jede Rolle höchstens einmal). Im Koop liegen alle Rollen <b>offen</b> – ihr seht sie in der Gruppenleiste:</p>
      <ul class="spalten">${Object.keys(L).map(e=>`<li>${L[e].symbol} <b>${L[e].name}:</b> ${L[e].bonus}</li>`).join("")}</ul>`},{symbol:"🔄",titel:"Dein Zug (Regel-Modus)",html:()=>`
      <p>Wenn du dran bist, steht dein Name in der Hinweisleiste und dein Panel ist hervorgehoben. Ein Zug hat immer diese Reihenfolge:</p>
      <ol class="anl-schritte">
        <li><b>🎲 Weitsicht würfeln</b> – Knopf «Würfeln» (oder Taste <span class="taste">W</span>). Der W3 zeigt 1, 2 oder 3.</li>
        <li><b>🔍 Kacheln aufdecken</b> – Jetzt <b>leuchten</b> verdeckte Felder im Umkreis von ${U.WEITSICHT_RADIUS} Ringen um deine Figur. Klicke so viele an, wie der Würfel zeigt.</li>
        <li><b>👣 Bewegen</b> – Jetzt leuchten die <b>Nachbarfelder</b>. Klicke eines an oder ziehe deine Figur darauf. Jeder Schritt kostet ${U.SCHRITT_ENERGIE} Energie.
          Betrittst du ein verdecktes Feld, wird es aufgedeckt. Du kannst mehrmals ziehen, solange du Energie hast.</li>
        <li><b>🪓 Abbauen</b> (wenn du auf Baum, Fels, Blätterbusch oder Strandgut stehst) – Knopf «Abbauen». Kostet <b>keine Energie</b>, aber <b>beendet die Bewegung</b>. Craften, Essen und Trinken gehen danach noch.</li>
        <li><b>💧 Trinken</b> – stehst du auf einem Wasserfeld, erscheint der Knopf «Trinken»: Energie sofort voll, so oft du willst (nicht bei Trockenperiode).</li>
        <li><b>🛠️ Craften, essen, handeln</b> – geht jederzeit in deinem Zug über dein Panel.</li>
        <li><b>✅ Zug beenden</b> – Knopf «Zug beenden» (oder <span class="taste">Enter</span>). Bist du nicht gezogen, hast du gerastet: +${U.RASTEN} Energie.</li>
      </ol>
      <p class="tipp-zeile">💡 Danach ziehen die anderen Spieler bzw. die KI. Gestrichelte Pfeile in der Spielerfarbe zeigen, wohin die KI gegangen ist.
        Verklickt? <span class="taste">↶ Rückgängig</span> oder <span class="taste">Strg</span>+<span class="taste">Z</span> (geht nicht nach Würfeln oder Aufdecken).</p>`},{symbol:"🌳",titel:"Felder und Rohstoffe",html:()=>`
      <h3>Was man abbauen kann</h3>

        <tr><td>${G("blaetter",16)} Blätterbusch</td><td>${k(ne.FELDER.blaetterbusch.ertrag)}</td><td>–</td></tr>
        <tr><td>${G("abfall",16)} Strandgut</td><td>${k(ne.FELDER.strandgut.ertrag)}</td><td>–</td></tr>

      <p>Abgebaute Felder sind danach leer (Grundboden). Im Koop sind die Rohstoffe aller Figuren offen (Gruppenleiste rechts):
        ${G("holz",16)} Holz · ${G("stein",16)} Stein · ${G("blaetter",16)} Blätter · ${G("seil",16)} Seil · ${G("abfall",16)} Abfall · ${G("nahrung",16)} Nahrung</p>
      <h3>Besondere Felder</h3>
      <ul>
        <li>${G("wasser",16)} <b>Wasserfeld</b> (Quelle, Bergquelle, Süsswasser): Knopf «💧 Trinken» → Energie voll, so oft du willst (nicht bei Trockenperiode).</li>
        <li>❗ <b>Spezialfeld:</b> Du ziehst eine Spezialkarte. Joker kommen auf die Hand, Gefahren wirken sofort.</li>
        <li>🐾 <b>Tier:</b> Beim Aufdecken kommt ein Tier aus dem Beutel. Betrittst du das Feld, musst du kämpfen oder fliehen (nächstes Kapitel).</li>
        <li>🗿 <b>Vulkanfels mit Kompass:</b> nur mit Spitzhacke zu bergen – wichtig fürs Floss.</li>
        <li>✈️ <b>Flugzeugwrack</b> – bleibt wie die Wasserfelder immer liegen. Die übrigen 6 Vulkanfelder sind leer.</li>
      </ul>`},{symbol:"🛠️",titel:"Craften und Bauen",html:()=>`
      <p>Mit Rohstoffen stellst du Werkzeuge und Bauten her. Im Regel-Modus stehen die Rezepte in deinem Panel unter «🛠️ Craften» –
        was du bezahlen kannst, ist anklickbar. Übersicht jederzeit: Knopf <span class="taste">📜 Rezepte</span> oder im Panel <span class="taste">📜 Rezeptkarte</span>
        (zeigt auch die Fluchtkosten für eure Spielerzahl und hebt hervor, was du gerade bezahlen kannst).</p>
      <table class="anl-tabelle">
        <tr><th>Gegenstand</th><th>Kosten</th><th>Wirkung</th></tr>
        ${Object.values(K).map(e=>`<tr><td>${e.symbol} ${e.name}</td><td>${k(e.kosten)}</td><td>${e.wirkung}</td></tr>`).join("")}
      </table>
      <p><b>⛵ Segel (Gruppe):</b> gehört allen, wird nur 1× pro Partie gebaut – von irgendeiner Figur aus den eigenen Händen, jederzeit im Zug (kein Kompass, kein Sammelfeld nötig).
        Es liegt danach auf dem Floss-Tableau, ist keine Ausrüstung und geht nicht verloren. <b>Ohne Segel kein solides Floss.</b></p>
      <p class="tipp-zeile">💡 Gute Reihenfolge: Blätter sammeln → Seil → Spitzhacke (für den Kompass) oder Steinaxt (mehr Holz).</p>`},{symbol:"🐾",titel:"Tiere, Karten, Tage",html:()=>`
      <h3>🐾 Tierkampf</h3>
      <p>Wird ein Tierfeld aufgedeckt, kommt ein Tier aus dem Beutel und liegt als rundes Plättchen auf dem Feld. Die Zahl unten ist der Zielwert.
        Betrittst du das Feld: <b>⚔️ Kämpfen</b> (Taste <span class="taste">K</span>) oder auf ein weiss umrandetes Feld <b>fliehen</b> (${A.FLUCHT_ENERGIE} Energie).
        <b>Achtung:</b> Fliehen geht nur bei Tieren, die du vorher offen gesehen hast. Betrittst du ein <b>verdecktes</b> Tierfeld blind, musst du kämpfen.</p>
      <p class="anl-tiere">${Ot("hase",52)} ${Ot("krebs",52)} ${Ot("baer",52)} ${Ot("krokodil",52)}</p>
      <ul>
        <li><b>Kleine Tiere</b> (Hase, Huhn, Schwein, Krebs): W6 + Bonus muss mindestens ${A.ZIEL_KLEIN} sein. Sieg = ${A.NAHRUNG_KLEIN} Nahrung, Niederlage ohne Schaden.</li>
        <li><b>Grosse Tiere</b> (Bär, Tiger, Schlange, Krokodil): mindestens ${A.ZIEL_GROSS}. Sieg = ${A.NAHRUNG_GROSS} Nahrung, Niederlage = −${A.NIEDERLAGE_GROSS_HERZEN} Herz.</li>
        <li>Bonus: Waffe (Speer +1, Machete +2), Jäger +1.</li>
      </ul>
      <h3>❗ Spezialkarten</h3>
      <p>Joker (z. B. Fernglas, Adrenalin) und Glücksfunde (Heilkräuter, Aussichtsfelsen, Wrack-Fass) kommen auf deine Hand, du spielst sie im Panel aus.

- Abgebaute Plättchen werden entfernt: es bleibt leerer Boden. Tierfelder bleiben, bis das Tier besiegt ist. Wasserfelder und Flugzeugwrack bleiben dauerhaft.

    <p>Tagesreihe: ${J.RUHIGE_TAGE} × «Ruhiger Tag» + ${J.EREIGNISSE_PRO_PARTIE} zufällige aus 20 Ereignissen, gemischt; die 20. Karte ist die Lava.
      Pro Tag (= eine Runde aller Spieler) wird 1 Karte aufgedeckt. Die Lava-Karte: alle, die noch auf der Insel sind, verlieren.</p>
  </section>

  <section><h2>🔄 Zug eines Spielers</h2>
    <ol>
      <li><b>Weitsicht:</b> W3 würfeln, so viele verdeckte Kacheln im Umkreis von ${U.WEITSICHT_RADIUS} Ringen aufdecken.</li>
      <li><b>Bewegung:</b> ${U.SCHRITT_ENERGIE} Energie pro Schritt, betretene Felder werden aufgedeckt.</li>
      <li><b>Abbau</b> (kostet keine Energie, beendet die Bewegung, das Plättchen wird entfernt): Baum 2 Holz (Axt 3) + 1 Blatt · Fels 2 Stein (Spitzhacke 3) · Blätterbusch 2 Blätter · Strandgut 1 Abfall.</li>
      <li><b>Spezialfeld, Bauen, Interaktion:</b> Spezialfeld = Spezialkarte ziehen. Craften, Essen und Trinken jederzeit im Zug (auch nach dem Abbau).
        Schenken oder Tauschen im Umkreis ${re.RADIUS}.</li>
    </ol>
    <p><b>Regeneration:</b> Rasten (keine Bewegung im Zug) +${U.RASTEN} Energie, im Shelter +${U.RASTEN_SHELTER} · Nahrung +${U.NAHRUNG_ENERGIE} Energie · Auf einem Wasserfeld «💧 Trinken»: Energie auf Maximum, beliebig oft (nicht bei Trockenperiode).</p>
  </section>

  <section><h2>🐾 Tiere</h2>
    <p>Flucht: ${A.FLUCHT_ENERGIE} Energie, kein Kampf – nur bei Tieren, die man vorher offen gesehen hat. Wer ein verdecktes Tierfeld blind betritt (oder in einen Hinterhalt gerät), muss kämpfen.
      Tierbeutel 60 % klein, 40 % gross.</p>
    <ul>
      <li>Klein (Hase, Wildhuhn, Schwein, Krebs), W6 + Bonus ≥ ${A.ZIEL_KLEIN}: Sieg = ${A.NAHRUNG_KLEIN} Nahrung, Niederlage = kein Schaden.</li>
      <li>Gross (Bär, Tiger, Schlange, Krokodil), W6 + Bonus ≥ ${A.ZIEL_GROSS}: Sieg = ${A.NAHRUNG_GROSS} Nahrung, Niederlage = −${A.NIEDERLAGE_GROSS_HERZEN} Herz, Zug endet, Tier bleibt.</li>
    </ul>
  </section>

    <p><b>⛵ Segel (Gruppe):</b> gehört der ganzen Gruppe, nur 1× pro Partie. Jede Figur kann es jederzeit im Zug aus den eigenen Händen bauen (kein Kompass, kein Sammelfeld nötig).
      Es liegt danach auf dem Floss-Tableau, ist keine Ausrüstung (kein Limit «1 pro Typ») und kann nicht verloren gehen.</p>
  </section>

  <section><h2>❗ Spezialkarten</h2>
    <p>Pool ${sn} Karten (aus der Liste berechnet). Stapel = Brennsprit + ${D.STAPEL-1} zufällige aus den übrigen ${sn-1}.</p>

  </section>

  </section>
